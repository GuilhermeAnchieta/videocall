<div class="tile" [class.speaking]="participant().isSpeaking" [class.frozen]="frozen()">
  <video
    #videoEl
    class="tile-video"
    [class.hidden]="!participant().cameraEnabled"
    [class.mirrored]="!participant().isFake"
    autoplay
    playsinline
    muted
  ></video>

  @if (!participant().cameraEnabled) {
    <div class="avatar">
      <span class="avatar-circle">{{ initials() }}</span>
    </div>
  }

  @if (frozen()) {
    <div class="frozen-overlay">
      <span class="material-symbols-outlined">signal_disconnected</span>
      <span>Connection lost…</span>
    </div>
  }

  @if (isOwner() && participant().isFake) {
    <div class="fake-badge" title="Fake participant (visible only to you)">
      <span class="material-symbols-outlined">smart_toy</span>
    </div>

    <div class="fake-controls">
      <button
        type="button"
        class="fake-btn"
        [title]="participant().micEnabled ? 'Mute' : 'Unmute'"
        (click)="toggleFakeMic.emit()"
      >
        <span class="material-symbols-outlined">{{ participant().micEnabled ? 'mic' : 'mic_off' }}</span>
      </button>
      <button
        type="button"
        class="fake-btn"
        [title]="participant().cameraEnabled ? 'Turn off camera' : 'Turn on camera'"
        (click)="toggleFakeCamera.emit()"
      >
        <span class="material-symbols-outlined">{{
          participant().cameraEnabled ? 'videocam' : 'videocam_off'
        }}</span>
      </button>
      <button type="button" class="fake-btn remove" title="Remove fake participant" (click)="removeFake.emit()">
        <span class="material-symbols-outlined">person_remove</span>
      </button>
    </div>
  }

  <div class="tile-footer">
    <span class="name">
      {{ participant().name }}
      @if (participant().isLocal) {
        <span class="you-tag">(you)</span>
      }
    </span>
    @if (!participant().micEnabled) {
      <span class="material-symbols-outlined mic-off">mic_off</span>
    }
  </div>
</div>
