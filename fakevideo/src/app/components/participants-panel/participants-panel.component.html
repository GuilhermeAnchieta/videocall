<aside class="panel">
  <header class="panel-header">
    <h2>Participantes ({{ participants().length }})</h2>
    <button type="button" class="icon-btn" (click)="close.emit()" title="Fechar">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <ul class="participant-list">
    @for (p of participants(); track p.identity) {
      <li class="participant-row">
        <span class="row-name">{{ p.name }}@if (p.isLocal) { <span class="you-tag">(você)</span> }</span>
        <span class="row-icons">
          @if (!p.micEnabled) {
            <span class="material-symbols-outlined muted-icon">mic_off</span>
          }
          @if (!p.cameraEnabled) {
            <span class="material-symbols-outlined muted-icon">videocam_off</span>
          }
        </span>
      </li>
    }
  </ul>
</aside>
