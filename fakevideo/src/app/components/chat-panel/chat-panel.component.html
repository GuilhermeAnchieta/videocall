<aside class="panel">
  <header class="panel-header">
    <h2>Chat</h2>
    <button type="button" class="icon-btn" (click)="close.emit()" title="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <div class="messages" #scrollContainer>
    @for (m of messages(); track m.id) {
      <div class="message" [class.own]="m.isLocal">
        @if (!m.isLocal) {
          <span class="sender">{{ m.senderName }}</span>
        }
        <span class="bubble">{{ m.text }}</span>
      </div>
    } @empty {
      <p class="empty-hint">No messages yet. Say hi!</p>
    }
  </div>

  <form class="composer" (submit)="$event.preventDefault(); submit()">
    <input
      type="text"
      placeholder="Message everyone"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      name="chatDraft"
      autocomplete="off"
    />
    <button type="submit" class="send-btn" title="Send">
      <span class="material-symbols-outlined">send</span>
    </button>
  </form>
</aside>
