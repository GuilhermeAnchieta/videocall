<div class="controls-bar">
  <div class="control-pair" #micWrap>
    @if (micMenuOpen()) {
      <div class="device-menu" role="dialog" aria-label="Escolher microfone e alto-falante">
        <label class="device-field">
          <span class="material-symbols-outlined">mic</span>
          <select [ngModel]="selectedMicId()" (ngModelChange)="onMicSelected($event)">
            @for (mic of microphones(); track mic.deviceId) {
              <option [value]="mic.deviceId">{{ mic.label || 'Microfone' }}</option>
            }
          </select>
        </label>

        <label class="device-field">
          <span class="material-symbols-outlined">volume_up</span>
          @if (sinkIdSupported) {
            <select [ngModel]="selectedSpeakerId()" (ngModelChange)="onSpeakerSelected($event)">
              @for (speaker of speakers(); track speaker.deviceId) {
                <option [value]="speaker.deviceId">{{ speaker.label || 'Alto-falante' }}</option>
              }
            </select>
          } @else {
            <span class="hint">Seu navegador não permite trocar a saída de áudio.</span>
          }
        </label>
      </div>
    }

    <button
      type="button"
      class="control-btn"
      [class.off]="!micEnabled()"
      [title]="micEnabled() ? 'Desligar microfone' : 'Ligar microfone'"
      (click)="toggleMic.emit()"
    >
      <span class="material-symbols-outlined">{{ micEnabled() ? 'mic' : 'mic_off' }}</span>
    </button>
    <button
      type="button"
      class="chevron-btn"
      [class.active]="micMenuOpen()"
      title="Escolher microfone e alto-falante"
      (click)="toggleMicMenu()"
    >
      <span class="material-symbols-outlined">expand_less</span>
    </button>
  </div>

  <div class="control-pair" #cameraWrap>
    @if (cameraMenuOpen()) {
      <div class="device-menu" role="dialog" aria-label="Escolher câmera">
        <label class="device-field">
          <span class="material-symbols-outlined">videocam</span>
          @if (cameras().length > 0) {
            <select [ngModel]="selectedCameraId()" (ngModelChange)="onCameraSelected($event)">
              @for (cam of cameras(); track cam.deviceId) {
                <option [value]="cam.deviceId">{{ cam.label || 'Câmera' }}</option>
              }
            </select>
          } @else {
            <span class="hint">Nenhuma câmera encontrada.</span>
          }
        </label>
      </div>
    }

    <button
      type="button"
      class="control-btn"
      [class.off]="!cameraEnabled()"
      [title]="cameraEnabled() ? 'Desligar câmera' : 'Ligar câmera'"
      (click)="toggleCamera.emit()"
    >
      <span class="material-symbols-outlined">{{ cameraEnabled() ? 'videocam' : 'videocam_off' }}</span>
    </button>
    <button
      type="button"
      class="chevron-btn"
      [class.active]="cameraMenuOpen()"
      title="Escolher câmera"
      (click)="toggleCameraMenu()"
    >
      <span class="material-symbols-outlined">expand_less</span>
    </button>
  </div>

  @if (isOwner()) {
    <button
      type="button"
      class="control-btn"
      [class.active]="usingClip()"
      title="Clipes (trocar sua câmera ou adicionar participantes falsos)"
      (click)="toggleClipsPanel.emit()"
    >
      <span class="material-symbols-outlined">movie</span>
    </button>
  }

  <button
    type="button"
    class="control-btn"
    [class.active]="participantsOpen()"
    title="Participantes"
    (click)="toggleParticipants.emit()"
  >
    <span class="material-symbols-outlined">group</span>
    @if (participantsCount() > 0) {
      <span class="count-badge">{{ participantsCount() }}</span>
    }
  </button>

  <button
    type="button"
    class="control-btn"
    [class.active]="chatOpen()"
    title="Chat"
    (click)="toggleChat.emit()"
  >
    <span class="material-symbols-outlined">chat</span>
    @if (hasUnreadChat()) {
      <span class="dot-badge"></span>
    }
  </button>

  <div class="leave-wrap" #leaveWrap>
    @if (confirmingLeave()) {
      <div class="leave-confirm" role="dialog" aria-label="Confirmar saída da chamada">
        <span>Sair da chamada?</span>
        <div class="leave-confirm-actions">
          <button type="button" class="cancel-btn" (click)="cancelLeave()">Cancelar</button>
          <button type="button" class="confirm-btn" (click)="confirmLeave()">Sair</button>
        </div>
      </div>
    }
    <button
      type="button"
      class="control-btn leave"
      [class.armed]="confirmingLeave()"
      title="Sair da chamada"
      (click)="requestLeave()"
    >
      <span class="material-symbols-outlined">call_end</span>
    </button>
  </div>
</div>
