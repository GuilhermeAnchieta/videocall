<div class="controls-bar">
  <div class="bar-pill">
    <div class="control-pair" #micWrap>
      @if (micMenuOpen()) {
        <div
          class="device-menu"
          role="dialog"
          aria-label="Choose microphone and speaker"
        >
          <label class="device-field">
            <span class="material-symbols-outlined">mic</span>
            <select
              [ngModel]="selectedMicId()"
              (ngModelChange)="onMicSelected($event)"
            >
              @for (mic of microphones(); track mic.deviceId) {
                <option [value]="mic.deviceId">
                  {{ mic.label || "Microphone" }}
                </option>
              }
            </select>
          </label>

          <label class="device-field">
            <span class="material-symbols-outlined">volume_up</span>
            @if (sinkIdSupported) {
              <select
                [ngModel]="selectedSpeakerId()"
                (ngModelChange)="onSpeakerSelected($event)"
              >
                @for (speaker of speakers(); track speaker.deviceId) {
                  <option [value]="speaker.deviceId">
                    {{ speaker.label || "Speaker" }}
                  </option>
                }
              </select>
            } @else {
              <span class="hint"
                >Your browser doesn't support changing audio output.</span
              >
            }
          </label>
        </div>
      }

      <div class="pair-shape" [class.off]="!micEnabled()">
        <button
          type="button"
          class="chevron-btn"
          [class.active]="micMenuOpen()"
          title="Choose microphone and speaker"
          (click)="toggleMicMenu()"
        >
          @if (micEnabled()) {
            <span class="audio-bars" aria-hidden="true">
              <span
                class="audio-bar"
                [style.height.%]="micLevels()[0] * 100"
              ></span>
              <span
                class="audio-bar"
                [style.height.%]="micLevels()[1] * 100"
              ></span>
              <span
                class="audio-bar"
                [style.height.%]="micLevels()[2] * 100"
              ></span>
            </span>
          } @else {
            <span class="material-symbols-outlined">expand_less</span>
          }
        </button>
        <button
          type="button"
          class="control-btn"
          [class.off]="!micEnabled()"
          [title]="micEnabled() ? 'Turn off microphone' : 'Turn on microphone'"
          (click)="toggleMic.emit()"
        >
          <span class="material-symbols-outlined">{{
            micEnabled() ? "mic" : "mic_off"
          }}</span>
        </button>
      </div>
    </div>

    <div class="control-pair" #cameraWrap>
      @if (cameraMenuOpen()) {
        <div class="device-menu" role="dialog" aria-label="Choose camera">
          <label class="device-field">
            <span class="material-symbols-outlined">videocam</span>
            @if (cameras().length > 0) {
              <select
                [ngModel]="selectedCameraId()"
                (ngModelChange)="onCameraSelected($event)"
              >
                @for (cam of cameras(); track cam.deviceId) {
                  <option [value]="cam.deviceId">
                    {{ cam.label || "Camera" }}
                  </option>
                }
              </select>
            } @else {
              <span class="hint">No camera found.</span>
            }
          </label>
        </div>
      }

      <div class="pair-shape" [class.off]="!cameraEnabled()">
        <button
          type="button"
          class="chevron-btn"
          [class.active]="cameraMenuOpen()"
          title="Choose camera"
          (click)="toggleCameraMenu()"
        >
          <span class="material-symbols-outlined">expand_less</span>
        </button>
        <button
          type="button"
          class="control-btn"
          [class.off]="!cameraEnabled()"
          [title]="cameraEnabled() ? 'Turn off camera' : 'Turn on camera'"
          (click)="toggleCamera.emit()"
        >
          <span class="material-symbols-outlined">{{
            cameraEnabled() ? "videocam" : "videocam_off"
          }}</span>
        </button>
      </div>
    </div>

    <button type="button" class="control-btn" title="Compartilhar tela">
      <span class="material-symbols-outlined">screen_share</span>
    </button>

    <div class="reaction-wrap" #reactionWrap>
      @if (reactionMenuOpen()) {
        <div class="reaction-picker" role="dialog" aria-label="Send a reaction">
          @for (emoji of REACTIONS; track emoji) {
            <button
              type="button"
              class="reaction-option"
              (click)="pickReaction(emoji)"
            >
              {{ emoji }}
            </button>
          }
        </div>
      }
      <button
        type="button"
        class="control-btn"
        [class.active]="reactionMenuOpen()"
        title="Reações"
        (click)="toggleReactionMenu()"
      >
        <span class="material-symbols-outlined">mood</span>
      </button>
    </div>

    <button type="button" class="control-btn" title="Legendas">
      <span class="material-symbols-outlined">closed_caption</span>
    </button>

    <button
      type="button"
      class="control-btn"
      [class.active]="handRaised()"
      [title]="handRaised() ? 'Abaixar a mão' : 'Levantar a mão'"
      (click)="toggleHand.emit()"
    >
      <span class="material-symbols-outlined">front_hand</span>
    </button>

    <div class="control-pair more-wrap" #moreWrap>
      @if (moreMenuOpen()) {
        <div class="more-menu" role="menu" aria-label="More options">
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">grid_view</span>
            <span>Change layout</span>
          </button>
          <button
            type="button"
            class="more-menu-item more-menu-item-highlight"
            role="menuitem"
            (click)="toggleFullscreen()"
          >
            <span class="material-symbols-outlined">{{
              isFullscreen() ? "fullscreen_exit" : "fullscreen"
            }}</span>
            <span>{{
              isFullscreen() ? "Exit full screen" : "Full screen"
            }}</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">picture_in_picture</span>
            <span>Open picture-in-picture</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">auto_awesome</span>
            <span>Backgrounds and effects</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">phone_in_talk</span>
            <span>Use a phone for audio</span>
          </button>
          <div class="more-menu-divider"></div>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">report</span>
            <span>Report a problem</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">block</span>
            <span>Report abuse</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">help</span>
            <span>Help and troubleshooting</span>
          </button>
          <button
            type="button"
            class="more-menu-item"
            role="menuitem"
            title="Coming soon"
          >
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
          </button>
        </div>
      }

      <button
        type="button"
        class="control-btn"
        [class.active]="moreMenuOpen()"
        title="More options"
        (click)="toggleMoreMenu()"
      >
        <span class="material-symbols-outlined">more_vert</span>
      </button>
    </div>

    @if (isOwner()) {
      <button
        type="button"
        class="control-btn"
        title="Clips (add fake participants)"
        (click)="toggleClipsPanel.emit()"
      >
        <span class="material-symbols-outlined">movie</span>
      </button>

      <div class="teleport-wrap" #teleportWrap>
        @if (confirmingTeleport()) {
          <div
            class="confirm-popover"
            role="dialog"
            aria-label="Confirm teleport"
          >
            <span>Teleport all clips out of the call?</span>
            <div class="leave-confirm-actions">
              <button
                type="button"
                class="cancel-btn"
                (click)="cancelTeleport()"
              >
                Cancel
              </button>
              <button
                type="button"
                class="confirm-btn"
                (click)="confirmTeleport()"
              >
                Teleport
              </button>
            </div>
          </div>
        }
        <button
          type="button"
          class="control-btn"
          [class.armed]="confirmingTeleport()"
          title="Teleport (makes every clip freeze and drop from the call)"
          (click)="requestTeleport()"
        >
          <span class="material-symbols-outlined">bolt</span>
        </button>
      </div>
    }

    <div class="leave-wrap" #leaveWrap>
      @if (confirmingLeave()) {
        <div
          class="confirm-popover"
          role="dialog"
          aria-label="Confirm leaving the call"
        >
          <span>Leave the call?</span>
          <div class="leave-confirm-actions">
            <button type="button" class="cancel-btn" (click)="cancelLeave()">
              Cancel
            </button>
            <button type="button" class="confirm-btn" (click)="confirmLeave()">
              Leave
            </button>
          </div>
        </div>
      }
      <button
        type="button"
        class="control-btn leave"
        [class.armed]="confirmingLeave()"
        title="Leave the call"
        (click)="requestLeave()"
      >
        <span class="material-symbols-outlined">call_end</span>
      </button>
    </div>
  </div>

  <div class="bar-pill secondary">
    <button
      type="button"
      class="control-btn"
      [class.active]="participantsOpen()"
      title="Participants"
      (click)="toggleParticipants.emit()"
    >
      <span class="material-symbols-outlined">group</span>
      @if (participantsCount() > 0) {
        <span class="count-badge">{{ participantsCount() }}</span>
      }
    </button>

    <button
      type="button"
      class="control-btn"
      [class.active]="chatOpen()"
      title="Chat"
      (click)="toggleChat.emit()"
    >
      <span class="material-symbols-outlined">chat</span>
      @if (hasUnreadChat()) {
        <span class="dot-badge"></span>
      }
    </button>
  </div>
</div>
