[build]
  base = ""
  publish = "fakevideo/dist/fakevideo/browser"
  functions = "netlify/functions"
  command = "npm install && cd fakevideo && npm install && npm run build -- --configuration production"

[dev]
  command = "cd fakevideo && npm start"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# SPA fallback for the Angular Router. Scoped to the app's actual routes (see app.routes.ts)
# instead of "/*" — a blanket catch-all also matches the Angular dev server's own asset paths
# (/@fs/..., /@vite/client) in `netlify dev`, which breaks local bootstrap by serving index.html
# in place of those JS modules.
[[redirects]]
  from = "/call/*"
  to = "/index.html"
  status = 200

# Blocks inline <script> execution. The app has no inline scripts of its own
# (Angular's build emits external main.js/polyfills.js/runtime.js, same-origin,
# allowed by 'self'), so the only thing this actually disables is Netlify's own
# "Powered by Netlify" badge, which the platform injects as an inline bootstrap
# script at the edge (see https://docs.netlify.com/manage/projects/powered-by-netlify-badge/).
# Turning this off in Project configuration > General is the supported way to
# remove the badge; this header is the documented alternative when that's not
# available. If a legitimate need for inline scripts/eval shows up later
# (e.g. a library requiring WebAssembly), extend the value here rather than
# dropping the header, and re-test end-to-end on a real Netlify deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self'"
