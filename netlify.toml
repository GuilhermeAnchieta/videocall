[build]
  base = ""
  publish = "fakevideo/dist/fakevideo/browser"
  functions = "netlify/functions"
  command = "npm install && cd fakevideo && npm install && npm run build -- --configuration production"

[dev]
  command = "cd fakevideo && npm start"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# SPA fallback for the Angular Router. Scoped to the app's actual routes (see app.routes.ts)
# instead of "/*" — a blanket catch-all also matches the Angular dev server's own asset paths
# (/@fs/..., /@vite/client) in `netlify dev`, which breaks local bootstrap by serving index.html
# in place of those JS modules.
[[redirects]]
  from = "/call/*"
  to = "/index.html"
  status = 200
