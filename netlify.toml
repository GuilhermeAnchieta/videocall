[build]
  base = ""
  publish = "fakevideo/dist/fakevideo/browser"
  functions = "netlify/functions"
  command = "npm install && cd fakevideo && npm install && npm run build -- --configuration production"

[dev]
  command = "cd fakevideo && npm start"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# SPA fallback for the Angular Router. Requests that match a function with its own "path"
# (/api/create-room, /api/generate-token) are resolved before this redirect, so they don't collide.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
